Section "Device"
    Identifier "OculusFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
    # The Quest optics see Monterey's MDSS scanout rotated by 180 degrees.
    Option "Rotate" "UD"
    Option "SWCursor" "true"
EndSection

Section "Screen"
    Identifier "OculusScreen"
    Device "OculusFramebuffer"
    DefaultDepth 24
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection
